log_format fvs_json escape=json '{"ts":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status"}';
access_log /dev/stdout fvs_json;
error_log /dev/stderr warn;
limit_req_zone $binary_remote_addr zone=fvs_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=fvs_admin:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=fvs_webhook:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=fvs_support:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=fvs_agent:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=fvs_attribution:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=fvs_conn:10m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn fvs_conn 40;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.stripe.com https://link.com https://*.link.com https:; connect-src 'self' https://unpkg.com https://*.openstreetmap.org https://api.stripe.com https://link.com https://*.link.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://link.com https://*.link.com; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://www.mercadopago.com https://www.mercadopago.com.mx" always;

  location ~ ^/api/v1/health/(?:live|ready)$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 5s;
  }
  location ^~ /api/v1/admin/ {
    limit_req zone=fvs_admin burst=2 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 60s;
  }
  location ^~ /api/v1/webhooks/ {
    limit_req zone=fvs_webhook burst=120 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 20s;
  }
  location = /api/v1/support { limit_req zone=fvs_support burst=30 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param PATH_INFO $uri; fastcgi_param HTTP_X_REQUEST_ID $request_id; fastcgi_pass api:9000; fastcgi_read_timeout 30s; }
  location ^~ /api/v1/support/ { limit_req zone=fvs_support burst=30 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param PATH_INFO $uri; fastcgi_param HTTP_X_REQUEST_ID $request_id; fastcgi_pass api:9000; fastcgi_read_timeout 30s; }
  location ^~ /api/v1/agent/ { limit_req zone=fvs_agent burst=30 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param PATH_INFO $uri; fastcgi_param HTTP_X_REQUEST_ID $request_id; fastcgi_pass api:9000; fastcgi_read_timeout 30s; }
  location = /api/v1/marketing/event { limit_req zone=fvs_attribution burst=30 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param PATH_INFO $uri; fastcgi_param HTTP_X_REQUEST_ID $request_id; fastcgi_pass api:9000; fastcgi_read_timeout 30s; }
  location /api/ {
    limit_req zone=fvs_api burst=60 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param HTTP_X_REQUEST_ID $request_id;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 30s;
  }
  location = /robots.txt { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param PATH_INFO $uri; fastcgi_param HTTP_X_REQUEST_ID $request_id; fastcgi_pass api:9000; fastcgi_read_timeout 5s; }
  location = /sitemap.xml { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param PATH_INFO $uri; fastcgi_param HTTP_X_REQUEST_ID $request_id; fastcgi_pass api:9000; fastcgi_read_timeout 10s; }
  location ^~ /stay/ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/shim-php/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param PATH_INFO $uri; fastcgi_param HTTP_X_REQUEST_ID $request_id; fastcgi_pass api:9000; fastcgi_read_timeout 10s; }
  location = /js/config.js {
    alias /tmp/fvs-config.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
  }
  location ~* \.vue$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico)$ { add_header Cache-Control "public,max-age=3600"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
