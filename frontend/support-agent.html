<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FVS · Consola de soporte</title><link rel="stylesheet" href="/css/base.css"></head><body><main class="shell"><header class="topbar"><div class="brand">FVS<small>Soporte humano</small></div><a href="/admin.html">Backoffice</a></header>
<section class="agent-auth"><div class="field"><label>ID de agente</label><input id="agentId" autocomplete="username" placeholder="agente.nombre"></div><div class="field"><label>Clave de agente</label><input id="agentKey" type="password" autocomplete="current-password"></div><div class="field"><label>Nombre visible</label><input id="agentName" placeholder="Equipo FVS"></div><button id="connect" class="primary">Conectar</button><span id="presence" class="meta">Offline</span></section>
<section class="agent-layout"><aside class="agent-queue"><div class="agent-toolbar"><h2>Cola</h2><button id="refresh">Actualizar</button></div><div id="queue"></div></aside><section class="agent-thread"><div id="threadEmpty" class="empty">Selecciona o reclama una conversación.</div><div id="threadView" hidden><header class="agent-thread-head"><div><strong id="threadSubject"></strong><div id="threadMeta" class="meta"></div></div><div><button id="claim">Reclamar</button> <button id="resolve">Resolver</button></div></header><div id="messages" class="agent-messages"></div><form id="reply" class="agent-reply"><textarea id="replyText" rows="3" maxlength="12000" placeholder="Respuesta al huésped"></textarea><label class="terms"><input id="internal" type="checkbox"> Nota interna</label><button class="primary">Enviar</button></form></div></section></section>
</main><script src="/js/support-agent.js"></script></body></html>
