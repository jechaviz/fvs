name: FVS CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify committed release manifest
        run: make manifest-verify
      - name: Architecture + supply-chain gates
        run: make architecture-gate supply-chain-gate
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libmariadb-dev libssl-dev php-cli nginx clang
      - name: Release + sanitizers + shim contracts
        run: make test
      - name: Static analyzers
        run: make analyze
      - name: Static lint
        run: make lint
      - name: MySQL 8 integration
        run: ./scripts/test_mysql_docker.sh
