name: FVS Release Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '6.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify committed release manifest
        run: make manifest-verify
      - name: Architecture + supply-chain gates
        run: make architecture-gate supply-chain-gate
      - name: Verify release version binding
        env:
          FVS_RELEASE_VERSION: "${{ steps.version.outputs.value }}"
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          expected=os.environ["FVS_RELEASE_VERSION"]
          src=pathlib.Path("core/src/core.c").read_text(encoding="utf-8")
          m=re.search(r'fvs_version\(void\)\s*\{\s*return\s*"([0-9]+\.[0-9]+\.[0-9]+)-c-core"',src)
          if not m or m.group(1)!=expected:
              print(f"release version mismatch: requested={expected!r} core={(m.group(1) if m else None)!r}",file=sys.stderr)
              raise SystemExit(2)
          PY
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libmariadb-dev libssl-dev php-cli nginx clang
      - name: Verify source tree
        run: make verify
      - name: Build deterministic package
        run: make package VERSION="${{ steps.version.outputs.value }}" PACKAGE="../FVS-${{ steps.version.outputs.value }}.zip"
      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FVS-${{ steps.version.outputs.value }}
          path: ../FVS-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: "${{ github.token }}"
          VERSION: "${{ steps.version.outputs.value }}"
        run: gh release create "${GITHUB_REF_NAME}" "../FVS-${VERSION}.zip#FVS-${VERSION}.zip" --verify-tag --generate-notes --title "FVS ${VERSION}"
