name: FVS Release Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '6.0.0'
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libmariadb-dev libssl-dev php-cli nginx clang
      - name: Verify source tree
        run: make verify
      - name: Build deterministic package
        run: make package VERSION="${{ steps.version.outputs.value }}" PACKAGE="../FVS-${{ steps.version.outputs.value }}.zip"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FVS-${{ steps.version.outputs.value }}
          path: ../FVS-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
