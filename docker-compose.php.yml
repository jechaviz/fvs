services:
  mysql:
    image: ${FVS_MYSQL_IMAGE:-mysql:8.4.12}
    environment:
      MYSQL_DATABASE: ${FVS_DB_NAME:-fvs}
      MYSQL_USER: ${FVS_DB_USER:-fvs}
      MYSQL_PASSWORD: ${FVS_DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      TZ: UTC
    command: ["mysqld","--default-time-zone=+00:00","--transaction-isolation=READ-COMMITTED","--innodb-flush-log-at-trx-commit=1"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck: {test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"], interval: 5s, timeout: 3s, retries: 30}
  migrate:
    build: {context: ., dockerfile: deploy/Dockerfile.php}
    command: ["/usr/local/bin/fvs_migrate","/app/migrations"]
    env_file: .env
    environment: {FVS_DB_HOST: mysql}
    depends_on: {mysql: {condition: service_healthy}}
    restart: "no"
  php-api:
    build: {context: ., dockerfile: deploy/Dockerfile.php}
    networks:
      default:
        aliases: [api]
    env_file: .env
    environment: {FVS_DB_HOST: mysql, FVS_ALLOWED_ORIGINS: "${FVS_PUBLIC_BASE_URL:-http://localhost:8080}"}
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "php", "-d", "ffi.enable=true", "-r", "require '/app/shim-php/Core.php'; $s=(new FvsCore())->schemaStatus(getenv('FVS_SCHEMA_REQUIRED')?:'001_current.sql'); exit(!empty($s['ready'])?0:1);"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes: ["vouchers:/app/var/vouchers"]
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.php}
    command: ["sh","/app/deploy/preflight.sh","worker","php","/app/workers/worker.php"]
    env_file: .env
    environment: {FVS_DB_HOST: mysql}
    depends_on: {migrate: {condition: service_completed_successfully}}
    volumes: ["vouchers:/app/var/vouchers"]
  web:
    image: nginx:1.30.5-alpine
    ports: ["8080:80"]
    environment: {STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"}
    volumes:
      - ./frontend:/usr/share/nginx/html-src:ro
      - ./shim-php:/app/shim-php:ro
      - ./deploy/nginx/php.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/web-entrypoint.sh:/fvs-entrypoint.sh:ro
    entrypoint: ["/bin/sh","/fvs-entrypoint.sh"]
    depends_on: {php-api: {condition: service_healthy}}
volumes: {mysql-data: {}, vouchers: {}}
